<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>道路养护工单</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;padding:16px;min-height:100vh}
    .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
    .title{font-size:17px;font-weight:600;color:#1a1a1a;flex:1}
    .status{padding:3px 10px;border-radius:10px;font-size:11px;color:#fff;flex-shrink:0;margin-left:10px}
    .status-pending{background:#FA8C16}
    .status-processing{background:#1677FF}
    .status-accepting{background:#722ED1}
    .status-done{background:#52C41A}
    .info-row{display:flex;margin-bottom:10px;font-size:14px}
    .info-label{color:#999;width:60px;flex-shrink:0}
    .info-value{color:#333;flex:1;word-break:break-all}
    .desc{color:#555;font-size:14px;line-height:1.6;margin-top:4px}
    .section-title{font-size:14px;font-weight:500;color:#333;margin-bottom:10px;display:flex;align-items:center}
    .section-title::before{content:'';display:inline-block;width:3px;height:14px;background:#1677FF;border-radius:2px;margin-right:8px}
    .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}
    .no-photo{grid-column:1/-1;text-align:center;color:#999;padding:30px;font-size:13px}
    .nav-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;background:#1677FF;color:#fff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:500;margin:12px 0}
    .nav-btn.disabled{background:#ccc;pointer-events:none}
    .error{text-align:center;color:#999;padding:60px 20px;font-size:14px}
    .error-icon{font-size:48px;margin-bottom:12px}
    .footer{text-align:center;color:#bbb;font-size:12px;margin:20px 0}
    .timeline{margin-top:8px}
    .tl-item{display:flex;margin-bottom:10px;font-size:13px;position:relative}
    .tl-dot{width:8px;height:8px;border-radius:50%;background:#1677FF;margin-top:4px;margin-right:10px;flex-shrink:0}
    .tl-text{color:#666;flex:1}
    .tl-time{color:#aaa;font-size:11px}
    .urgent{color:#F5222D;font-weight:600}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script>
    // Parse data from URL hash
    // Supports: LZ-string compressed (new) and base64 (old)
    function getData() {
      var raw = location.hash.replace(/^#\/?/, '');
      if (!raw) return null;
      try {
        raw = decodeURIComponent(raw);
      } catch(e) {}
      raw = raw.replace(/^\//, '');

      // Try LZ-string decompression first (new format, shorter links)
      try {
        var json = LZString.decompressFromEncodedURIComponent(raw);
        if (json) return JSON.parse(json);
      } catch(e) {}

      // Fallback: old base64 format
      try {
        json = decodeURIComponent(escape(atob(raw)));
        return JSON.parse(json);
      } catch(e) {
        return null;
      }
    }

    function formatTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      var m = d.getMonth() + 1;
      var day = d.getDate();
      var h = d.getHours();
      var min = d.getMinutes();
      return m + '/' + day + ' ' + (h<10?'0':'')+h + ':' + (min<10?'0':'')+min;
    }

    function statusClass(s) {
      if (s === 'done' || s === '已完成') return 'status-done';
      if (s === 'processing' || s === '处理中') return 'status-processing';
      if (s === 'accepting' || s === '待验收') return 'status-accepting';
      return 'status-pending';
    }
    function statusLabel(s) {
      if (s === 'done' || s === '已完成') return '已完成';
      if (s === 'processing' || s === '处理中') return '处理中';
      if (s === 'accepting' || s === '待验收') return '待验收';
      if (s === 'pending' || s === '待指派') return '待指派';
      return s || '待指派';
    }

    function render() {
      var d = getData();
      var el = document.getElementById('content');
      if (!d) {
        el.innerHTML = '<div class="error"><div class="error-icon">&#x1F61E;</div>无法加载工单信息</div>';
        return;
      }

      var photosHtml = '';
      if (d.photos && d.photos.length > 0) {
        photosHtml = d.photos.map(function(u){
          return '<img src="'+u+'" class="photo" onerror="this.style.display=\'none\'" loading="lazy">';
        }).join('');
      } else {
        photosHtml = '<div class="no-photo">暂无现场照片</div>';
      }

      var navHtml = '';
      if (d.lat && d.lng) {
        navHtml = '<a href="https://apis.map.qq.com/uri/v1/marker?marker=coord:'+d.lat+','+d.lng+';title='+encodeURIComponent(d.roadName||'')+'&referer=roadmaint" class="nav-btn">导航到该位置</a>';
      } else {
        navHtml = '<div class="nav-btn disabled">暂无位置信息</div>';
      }

      var processedHtml = '';
      if (d.processRecord && d.processRecord.length > 0) {
        processedHtml = d.processRecord.map(function(r){
          var time = r.time ? '<span class="tl-time">'+formatTime(r.time)+'</span>' : '';
          return '<div class="tl-item"><div class="tl-dot"></div><div class="tl-text">'+(r.text||'')+' '+time+'</div></div>';
        }).join('');
      }

      var html = '';
      html += '<div class="card">';
      html += '<div class="title-row">';
      html += '<div class="title">'+(d.categoryName?d.categoryName+' &middot; ':'')+(d.problemType||'工单')+'</div>';
      html += '<div class="status '+statusClass(d.status)+'">'+statusLabel(d.status)+'</div>';
      html += '</div>';
      html += '<div class="info-row"><div class="info-label">路段</div><div class="info-value">'+(d.roadName||'未知')+'</div></div>';
      if (d.description) {
        html += '<div class="desc">'+(d.description)+'</div>';
      }
      html += '</div>';

      html += '<div class="card">';
      html += '<div class="info-row"><div class="info-label">等级</div><div class="info-value '+(d.urgentLevel==='紧急'?'urgent':'')+'">'+(d.urgentLevel||'一般')+'</div></div>';
      if (d.assigneeName) {
        html += '<div class="info-row"><div class="info-label">负责人</div><div class="info-value">'+(d.assigneeName)+'</div></div>';
      }
      if (d.assigneePhone) {
        html += '<div class="info-row"><div class="info-label">电话</div><div class="info-value"><a href="tel:'+(d.assigneePhone)+'" style="color:#1677FF;text-decoration:none">'+(d.assigneePhone)+'</a></div></div>';
      }
      html += '</div>';

      html += '<div class="card">';
      html += '<div class="section-title">现场照片</div>';
      html += '<div class="photos">'+photosHtml+'</div>';
      html += '</div>';

      if (d.lat && d.lng) {
        html += '<div class="card">';
        html += '<div class="section-title">位置导航</div>';
        html += '<div class="info-row"><div class="info-label">地址</div><div class="info-value">'+(d.roadName||'')+'</div></div>';
        html += navHtml;
        html += '</div>';
      } else if (!d.lat && !d.lng) {
        html += '<div class="card">';
        html += '<div class="section-title">位置导航</div>';
        html += navHtml;
        html += '</div>';
      }

      if (processedHtml) {
        html += '<div class="card">';
        html += '<div class="section-title">处理记录</div>';
        html += '<div class="timeline">'+processedHtml+'</div>';
        html += '</div>';
      }

      html += '<div class="footer">道路养护管理系统 &middot; '+(d.createTime?formatTime(d.createTime):'')+'</div>';
      el.innerHTML = html;
    }

    window.onload = render;
    window.onhashchange = render;
  </script>
</head>
<body>
  <div id="content"></div>
</body>
</html>
